[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-pulse"
version = "0.1.0"
description = "Spherical Grid Adaptive Bandwidth Nadaraya-Watson Estimator for Space Plasma VDFs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Phong Ho", email = "tph@ualberta.ca"}
]
keywords = ["space-plasma", "parker-solar-probe", "vdf", "nadaraya-watson", "kernel-regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "cdflib>=0.4.0",
    "matplotlib>=3.4.0",
    "tqdm>=4.60.0",
]

[project.scripts]
solar-pulse = "solar_pulse.cli:main"

[project.urls]
Repository = "https://github.com/yourusername/SOLAR_PULSE.git"